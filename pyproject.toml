[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxkit"
version = "0.1.0"
description = "Piper TTS voice manager library with interactive TUI"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Jakub T. Jankiewicz", email = "jcubic@jcubic.pl"},
]
keywords = ["tts", "text-to-speech", "piper", "voice", "voice-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "piper-tts",
]

[project.urls]
Homepage = "https://github.com/jcubic/voxkit"
Repository = "https://github.com/jcubic/voxkit"
Issues = "https://github.com/jcubic/voxkit/issues"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
